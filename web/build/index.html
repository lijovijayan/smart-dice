<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Smart Dice</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <!-- The shell only: the pages are built from src/features/ and mounted into #pages. -->
    <header>
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" />
          <circle cx="12" cy="12" r="1.5" fill="currentColor" />
          <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor" />
        </svg>
        <div>
          <h1>Smart Dice</h1>
          <p id="subtitle" class="sub"></p>
        </div>
      </div>
      <nav id="tabs" class="tabs" aria-label="Pages"></nav>
      <div class="actions">
        <span id="connection-status" class="status"
          ><i class="dot"></i><span id="connection-text">Not connected</span></span
        >
        <button id="connection-toggle" type="button" disabled>Connect</button>
      </div>
    </header>

    <p id="notice" class="notice" role="status"></p>

    <div id="pages" class="pages"></div>
    <script src="./three.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
